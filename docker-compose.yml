version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: receituario_mysql
    restart: always
    environment:
      MYSQL_DATABASE: receituario_db
      MYSQL_USER: receituario_user
      MYSQL_PASSWORD: receituario_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receituario_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: "local-development-only-change-before-deploy"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_ENGINE: "django.db.backends.mysql"
      DB_NAME: "receituario_db"
      DB_USER: "receituario_user"
      DB_PASSWORD: "receituario_password"
      DB_HOST: "db"
      DB_PORT: "3306"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_COOKIE_SECURE: "False"
      JWT_COOKIE_SAMESITE: "Lax"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: receituario_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql_data:
